<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Assistant - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            display: flex;
            flex-direction: column;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #1f2937;
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1);
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-280px);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .sidebar-header h3 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 24px;
            padding: 5px;
            line-height: 1;
        }

        .new-chat-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .chat-item {
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .chat-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .chat-item-content {
            flex: 1;
            min-width: 0;
        }

        .chat-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            font-size: 11px;
            opacity: 0.7;
        }

        .delete-chat-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }

        .delete-chat-btn:hover {
            background: rgba(239, 68, 68, 0.4);
            color: #fee;
        }

        .user-section {
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .username {
            font-size: 14px;
            font-weight: 600;
            color: #e0e7ff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .username::before {
            font-size: 16px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Sidebar Toggle Button */
        .sidebar-toggle {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 101;
            background: #1f2937;
            color: white;
            border: none;
            width: 32px;
            height: 60px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: left 0.3s ease;
            box-shadow: 2px 0 8px rgba(0,0,0,0.2);
        }

        .sidebar-toggle.expanded {
            left: 280px;
        }

        .sidebar-toggle:hover {
            background: #374151;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: calc(100% - 280px);
            transition: margin-left 0.3s ease, width 0.3s ease;
        }

        .main-content.full-width {
            margin-left: 0;
            width: 100%;
        }

        /* Header */
        .header {
            background: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 24px;
            color: #1f2937;
        }

        .header-info {
            font-size: 14px;
            color: #6b7280;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 30px;
            padding-bottom: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            max-width: 100%;
        }

        .message {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            animation: slideIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: white;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .evidence-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .evidence-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* Recommendations */
        .recommendations-container {
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-radius: 12px;
            border-left: 4px solid #667eea;
            max-width: 100%;
        }

        .recommendations-container p {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }

        .recommendation-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: white;
            color: #374151;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
            word-wrap: break-word;
            white-space: normal;
        }

        .recommendation-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: translateX(4px);
        }

        .recommendation-btn:last-child {
            margin-bottom: 0;
        }

        /* Input Area */
        .input-area {
            background: white;
            padding: 20px 30px;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
            z-index: 10;
        }

        .input-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .dropdown-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-group label {
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
            white-space: nowrap;
        }

        .custom-dropdown {
            position: relative;
            min-width: 140px;
        }

        .custom-dropdown select {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            padding: 8px 32px 8px 12px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .custom-dropdown select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .custom-dropdown::after {
            content: '▼';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: #6b7280;
            pointer-events: none;
        }

        .dropdown-right-group {
            display: flex;
            gap: 12px;
        }

        .api-key-btn {
            padding: 8px 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .api-key-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .api-key-btn.has-key {
            background: #10b981;
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #f3f4f6;
            padding: 12px 20px;
            border-radius: 30px;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
            color: #1f2937;
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stop-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            display: none;
        }

        .stop-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        .stop-btn.visible {
            display: block;
        }

        /* Loading State */
        .loading {
            display: inline-flex;
            gap: 5px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .welcome-message h2 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .welcome-message p {
            font-size: 16px;
        }

        /* Scrollbar */
        .chat-list::-webkit-scrollbar,
        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .chat-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .messages::-webkit-scrollbar-track {
            background: #f3f4f6;
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* API Key Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 20px;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .modal-header p {
            font-size: 14px;
            color: #6b7280;
        }

        .modal-input-group {
            margin-bottom: 20px;
        }

        .modal-input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .modal-input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal-input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: 'Inter', sans-serif;
        }

        .modal-btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .modal-btn-secondary:hover {
            background: #e5e7eb;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .api-key-status {
            font-size: 12px;
            color: #10b981;
            margin-top: 6px;
            display: none;
        }

        .api-key-status.visible {
            display: block;
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle" title="Toggle Sidebar">☰</button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Chat Sessions</h3>
            <button class="menu-btn">⋮</button>
        </div>

        <button class="new-chat-btn" id="newChatBtn">
            + New Chat
        </button>

        <div class="chat-list" id="chatList">
            <!-- Chat items will be dynamically loaded here -->
        </div>

        <div class="user-section">
            <div class="username" id="username">Username</div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Header -->
        <div class="header">
            <h1>Health Assistant</h1>
            <div class="header-info">
                Loaded Conversational History...
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="messages" id="messages">
                <div class="welcome-message">
                    <h2>Hello! Welcome to Health Assistant</h2>
                    <p>Ask me anything about health topics and I'll provide evidence-based answers.</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-controls-row">
                <!-- Left: Answer Length Dropdown -->
                <div class="dropdown-group">
                    <label>Answer Length:</label>
                    <div class="custom-dropdown">
                        <select id="answerLengthSelect">
                            <option value="short">Short</option>
                            <option value="medium" selected>Medium</option>
                            <option value="long">Long</option>
                        </select>
                    </div>
                </div>

                <!-- Right: Provider & Model Dropdowns + API Key Button -->
                <div class="dropdown-right-group">
                    <div class="dropdown-group">
                        <label>Provider:</label>
                        <div class="custom-dropdown">
                            <select id="providerSelect">
                                <option value="">Select Provider</option>
                                <option value="openai">OpenAI</option>
                                <option value="anthropic">Anthropic</option>
                                <option value="google">Google</option>
                                <option value="groq">Groq</option>
                                <option value="cohere">Cohere</option>
                                <option value="mistral">Mistral</option>
                            </select>
                        </div>
                    </div>
                    <button class="api-key-btn" id="apiKeyBtn">Set API Key</button>
                    <div class="dropdown-group">
                        <label>Model:</label>
                        <div class="custom-dropdown">
                            <select id="modelSelect" disabled>
                                <option value="">Select Model</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-wrapper">
                <input type="text" id="queryInput" placeholder="Ask a Health-related Question...">
                <button class="stop-btn" id="stopBtn">⏹ Stop</button>
                <button class="send-btn" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <!-- API Key Modal -->
    <div class="modal-overlay" id="apiKeyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Enter API Key</h3>
                <p id="modalSubtitle">Please provide your API key for the selected provider.</p>
            </div>
            <div class="modal-input-group">
                <label for="apiKeyInput">API Key</label>
                <input type="password" id="apiKeyInput" placeholder="sk-... or your API key">
                <div class="api-key-status" id="apiKeyStatus">✓ API key saved for this provider</div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" id="modalCancelBtn">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="modalSaveBtn">Save Key</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:5001/api';
        const token = localStorage.getItem('accessToken');

        if (!token) {
            window.location.href = '/login.html';
        }

        // Display username
        const username = localStorage.getItem('username') || 'User';
        document.getElementById('username').textContent = username;

        let currentSessionId = null;
        let chatSessions = [];
        let conversationTurns = [];
        let currentEvidenceData = null;

        // Provider configurations with their model endpoints
        const PROVIDER_CONFIG = {
            openai: {
                name: 'OpenAI',
                modelsEndpoint: `${API_BASE_URL}/providers/openai/models`,
                keyPrefix: 'sk-'
            },
            anthropic: {
                name: 'Anthropic',
                modelsEndpoint: `${API_BASE_URL}/providers/anthropic/models`,
                keyPrefix: 'sk-ant-'
            },
            google: {
                name: 'Google',
                modelsEndpoint: `${API_BASE_URL}/providers/google/models`,
                keyPrefix: ''
            },
            groq: {
                name: 'Groq',
                modelsEndpoint: `${API_BASE_URL}/providers/groq/models`,
                keyPrefix: ''
            },
            cohere: {
                name: 'Cohere',
                modelsEndpoint: `${API_BASE_URL}/providers/cohere/models`,
                keyPrefix: ''
            },
            mistral: {
                name: 'Mistral',
                modelsEndpoint: `${API_BASE_URL}/providers/mistral/models`,
                keyPrefix: ''
            }
        };

        // ===== SIDEBAR TOGGLE =====
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const sidebarToggle = document.getElementById('sidebarToggle');
        let sidebarCollapsed = false;

        function toggleSidebar() {
            sidebarCollapsed = !sidebarCollapsed;
            if (sidebarCollapsed) {
                sidebar.classList.add('collapsed');
                mainContent.classList.add('full-width');
                sidebarToggle.classList.remove('expanded');
                sidebarToggle.innerHTML = '☰';
                sidebarToggle.style.left = '10px';
            } else {
                sidebar.classList.remove('collapsed');
                mainContent.classList.remove('full-width');
                sidebarToggle.classList.add('expanded');

            if (!provider || !PROVIDER_CONFIG[provider]) {
                modelSelect.innerHTML = '<option value="">Select Model</option>';
                modelSelect.disabled = true;
                return;
            }

            modelSelect.disabled = true;
            modelSelect.innerHTML = '<option value="">Loading models...</option>';

            const apiKey = localStorage.getItem(getApiKeyStorageKey(provider));

            try {
                const headers = { 'Authorization': `Bearer ${token}` };
                if (apiKey) {
                    headers['X-API-Key'] = apiKey;
                }

                const response = await fetch(PROVIDER_CONFIG[provider].modelsEndpoint, { headers });

                if (response.ok) {
                    const data = await response.json();
                    const models = data.models || [];

                    modelSelect.innerHTML = '<option value="">Select Model</option>';
                    models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.id || model.name;
                        option.textContent = model.name || model.id;
                        modelSelect.appendChild(option);

                    // Fallback: if API fails, allow manual entry or show error
                    modelSelect.innerHTML = '<option value="">Failed to load models</option>';

        function parsePublicIdFromUrl() {
            const pathParts = window.location.pathname.split('/');
            if (pathParts.length > 2 && pathParts[1] === 'chat') {
                const potentialUuid = pathParts[2];
                const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
                if (uuidRegex.test(potentialUuid)) {
                    return potentialUuid;
                }
            }
            return null;
        }

        // Extended color palette - NO RED colors (red reserved for no-evidence in graph only)
        const d3ColorScheme = [
            '#4e79a7', '#f28e2c', '#76b7b2', '#59a14f',
            '#edc949', '#af7aa1', '#9c755f', '#bab0ab',
            '#17becf', '#bcbd22', '#9467bd', '#8c564b',
            '#7f7f7f', '#2ca02c', '#ff7f0e', '#1f77b4',
            '#4ecdc4', '#95e1d3', '#aa96da', '#fcbad3',
            '#a8d8ea', '#c7ceea', '#ffd3b6', '#a8e6cf',
            '#dcedc1', '#6c5ce7', '#00b894', '#fdcb6e',
            '#e84393', '#0984e3', '#00cec9', '#a29bfe',
            '#fab1a0', '#74b9ff', '#55efc4', '#ffeaa7',
            '#55e6c1', '#778beb', '#f8a5c2', '#63cdda'
        ];

        const NO_EVIDENCE_COLOR = '#dc2626';

        function normalizeEntity(entity) {
            return entity.toLowerCase().trim()
                .replace(/['']s?/g, '')
                .replace(/\s+/g, ' ');
        }

        function entitiesMatch(entity1, entity2) {
            const norm1 = normalizeEntity(entity1);
            const norm2 = normalizeEntity(entity2);

            if (norm1 === norm2) return true;
            if (norm1.includes(norm2) || norm2.includes(norm1)) return true;

            const words1 = norm1.split(/\s+/);
            const words2 = norm2.split(/\s+/);
            const commonWords = words1.filter(w => words2.includes(w));

            if (commonWords.length > 0 && commonWords.length >= Math.min(words1.length, words2.length) * 0.5) {
                return true;
            }

            return false;
        }

        function buildEntityColorMapFromTriples(validatedTriples) {
            const colorMap = new Map();
            const entitiesWithEvidence = new Map();
            const entitiesWithoutEvidence = new Map();
            const triplesWithEvidence = [];

            if (!validatedTriples) return { colorMap, entitiesWithEvidence, triplesWithEvidence };

            validatedTriples.forEach(triple => {
                const hasStaticPubmedIds = triple.pubmed_ids && triple.pubmed_ids.length > 0;
                const hasStaticSentence = triple.sentence && triple.sentence.trim() !== '';
                const hasStaticKGEvidence = triple.static_kg && triple.static_kg.evidence_found;
                const hasLiveEvidence = triple.live_pubmed && triple.live_pubmed.found_new_evidence;
                const status = (triple.status || "").toLowerCase();
                const hasStatusBasedEvidence = status === 'supported' || 
                                              status === 'contradictory_evidence' || 
                                              status === 'emerging_evidence';

                const hasEvidence = hasStaticPubmedIds || hasStaticSentence || hasStaticKGEvidence || 
                                   hasLiveEvidence || hasStatusBasedEvidence;


                if (hasEvidence) {
                    triplesWithEvidence.push({
                        subject: normalizeEntity(triple.subject),
                        object: normalizeEntity(triple.object),
                        relation: triple.relation
                    });
                }
                if (triple.subject) {
                    const normalized = normalizeEntity(triple.subject);
                    if (hasEvidence) {
                        entitiesWithEvidence.set(normalized, triple.subject);
                        entitiesWithoutEvidence.delete(normalized);
                    } else if (!entitiesWithEvidence.has(normalized)) {
                        entitiesWithoutEvidence.set(normalized, triple.subject);
                    }
                }

                if (triple.object) {
                    const normalized = normalizeEntity(triple.object);
                    if (hasEvidence) {
                        entitiesWithEvidence.set(normalized, triple.object);
                        entitiesWithoutEvidence.delete(normalized);
                    } else if (!entitiesWithEvidence.has(normalized)) {
                        entitiesWithoutEvidence.set(normalized, triple.object);
                    }
                }
            });

            let colorIndex = 0;
            entitiesWithEvidence.forEach((originalEntity, normalizedEntity) => {
                if (!colorMap.has(normalizedEntity)) {
                    colorMap.set(normalizedEntity, d3ColorScheme[colorIndex % d3ColorScheme.length]);
                    colorIndex++;
                }
            });

            entitiesWithoutEvidence.forEach((originalEntity, normalizedEntity) => {
                if (!colorMap.has(normalizedEntity)) {
                    colorMap.set(normalizedEntity, NO_EVIDENCE_COLOR);
                }
            });

            return { colorMap, entitiesWithEvidence, entitiesWithoutEvidence, triplesWithEvidence };
        }

        function highlightEntitiesInText(text, responseData) {
            if (!responseData || !responseData.highlightedResponse) {
                return text;
            }

            const { colorMap, entitiesWithEvidence, triplesWithEvidence } = buildEntityColorMapFromTriples(responseData.validatedTriples);

            const regex = /\*\|(.*?)\|\*/g;
            let highlightedText = responseData.highlightedResponse;
            const fullText = highlightedText.toLowerCase();

            let matches = [];
            let match;
            while ((match = regex.exec(highlightedText)) !== null) {
                matches.push({
                    index: match.index,
                    length: match[0].length,
                    entity: match[1],
                    fullMatch: match[0]
                });
            }

            matches.reverse().forEach(({ index, length, entity, fullMatch }) => {
                const normalizedEntity = normalizeEntity(entity);

                const contextStart = Math.max(0, index - 100);
                const contextEnd = Math.min(fullText.length, index + length + 100);
                const context = fullText.substring(contextStart, contextEnd);

                let shouldHighlight = false;
                let matchedColor = null;

                for (const triple of triplesWithEvidence) {
                    const isSubject = entitiesMatch(normalizedEntity, triple.subject);
                    const isObject = entitiesMatch(normalizedEntity, triple.object);

                    if (isSubject || isObject) {
                        const otherEntity = isSubject ? triple.object : triple.subject;
                        const otherWords = otherEntity.split(/\s+/).filter(w => w.length > 2);
                        let wordsFound = 0;

                        for (const word of otherWords) {
                            if (context.includes(word)) {
                                wordsFound++;
                            }
                        }

                        if (otherWords.length > 0 && wordsFound / otherWords.length >= 0.5) {
                            shouldHighlight = true;

                            for (const [evidenceEntity, color] of colorMap.entries()) {
                                if (entitiesMatch(normalizedEntity, evidenceEntity)) {
                                    matchedColor = color;
                                    break;
                                }
                            }
                            break;
                        }
                    }
                }

                let replacement;
                if (shouldHighlight && matchedColor) {
                    replacement = `<span style="background: ${matchedColor}; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap;">${entity}</span>`;
                } else {
                    replacement = entity;
                }

                highlightedText = highlightedText.substring(0, index) + replacement + highlightedText.substring(index + length);
            });

            return highlightedText;
        }

        function displayMessage(text, sender, responseData = null) {
            const messagesDiv = document.getElementById('messages');

        let isProcessing = false;
        let abortController = null;

        async function sendMessage() {
            const queryInput = document.getElementById('queryInput');
            const query = queryInput.value.trim();
            if (!query) return;

            if (isProcessing) {
                alert('Please wait for the current query to complete or click Stop.');
                return;
            }

            const answerLength = document.getElementById('answerLengthSelect').value;
            const selectedProvider = providerSelect.value;
            const selectedModel = modelSelect.value;

            displayMessage(query, 'user');
            queryInput.value = '';

            // If no session exists, create one first
            if (!currentSessionId) {
                try {
                    const sessionResponse = await fetch(`${API_BASE_URL}/sessions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ title: 'New Chat' })
                    });

                    if (sessionResponse.status === 401) {
                        handleLogout();
                        return;
                    }
                    if (!sessionResponse.ok) throw new Error('Failed to create session.');

                    const newSession = await sessionResponse.json();
                    currentSessionId = newSession.id;
                    chatSessions.unshift(newSession);

                    window.history.pushState({}, "", `/chat/${newSession.public_id}`);

                    renderChatSessions();
                } catch (error) {
                    console.error('Error creating session:', error);
                    alert('Failed to create chat session. Please try again.');
                    return;
                }
            }

            isProcessing = true;
            abortController = new AbortController();
            toggleProcessingUI(true);

            const thinkingMsg = document.createElement('div');
            thinkingMsg.className = 'message ai';
            thinkingMsg.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
            document.getElementById('messages').appendChild(thinkingMsg);
            scrollToBottom();

            try {
                const requestBody = { 
                    query, 
                    answerLength,
                    session_id: currentSessionId
                };

                // Add provider and model if selected
                if (selectedProvider) {
                    requestBody.provider = selectedProvider;
                    const apiKey = localStorage.getItem(getApiKeyStorageKey(selectedProvider));
                    if (apiKey) {
                        requestBody.apiKey = apiKey;
                    }
                }
                if (selectedModel) {
                    requestBody.model = selectedModel;
                }

                const response = await fetch(`${API_BASE_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(requestBody),
                    signal: abortController.signal
                });

                thinkingMsg.remove();

                if (response.status === 401) {
                    handleLogout();
                    return;
                }
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Request failed');
                }

                const data = await response.json();

                if (data.predefinedResponse) {
                    displayMessage(data.predefinedResponse, 'ai');
                } else {
                    displayMessage(data.textualResponse || data.highlightedResponse, 'ai', data);
                }

                scrollToBottom();
                await refreshSidebar();

            } catch (error) {
                console.error('Error:', error);
                thinkingMsg.remove();

                if (error.name === 'AbortError') {
                    displayMessage('Query stopped by user.', 'ai');
                } else {
                    displayMessage(`Sorry, an error occurred: ${error.message}`, 'ai');
                }
            } finally {
                isProcessing = false;
                abortController = null;
                toggleProcessingUI(false);
            }
        }

        function stopProcessing() {
            if (abortController) {
                abortController.abort();
            }
        }

        function toggleProcessingUI(processing) {
            const sendBtn = document.getElementById('sendBtn');
            const stopBtn = document.getElementById('stopBtn');
            const queryInput = document.getElementById('queryInput');

            if (processing) {
                sendBtn.disabled = true;
                stopBtn.classList.add('visible');
                queryInput.disabled = true;
            } else {
                sendBtn.disabled = false;
                stopBtn.classList.remove('visible');
                queryInput.disabled = false;
            }
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleLogout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('username');
            window.location.href = '/login.html';
        }

        // Handle browser back/forward buttons
        window.addEventListener('popstate', async () => {
            const urlPublicId = parsePublicIdFromUrl();

            if (urlPublicId) {
                const session = chatSessions.find(s => s.public_id === urlPublicId);
                if (session && session.id !== currentSessionId) {
                    currentSessionId = session.id;
                    await loadChatHistory(session.id);
                } else if (!session) {
                    // Try fetching the session
                    try {
                        const response = await fetch(`${API_BASE_URL}/sessions/${urlPublicId}`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (response.ok) {
                            const sessionData = await response.json();
                            currentSessionId = sessionData.id;
                            await loadChatHistory(sessionData.id);
                        } else {
                            currentSessionId = null;
                            conversationTurns = [];
                            showWelcomeMessage();
                        }
                    } catch (e) {
                        currentSessionId = null;
                        conversationTurns = [];
                        showWelcomeMessage();
                    }
                }
            } else if (!urlPublicId && currentSessionId) {
                currentSessionId = null;
                conversationTurns = [];
                showWelcomeMessage();
            }
            renderChatSessions();
        });

        // Event Listeners
        document.getElementById('newChatBtn').addEventListener('click', createNewSession);
        document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('stopBtn').addEventListener('click', stopProcessing);
        document.getElementById('queryInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) sendMessage();
        });

        // Initialize
        loadChatSessions();
        loadSavedSelections();
    </script>
</body>
</html>
