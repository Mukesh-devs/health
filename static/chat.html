<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Assistant - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            display: flex;
            flex-direction: column;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #1f2937;
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .sidebar-header h3 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 24px;
            padding: 5px;
            line-height: 1;
        }

        .new-chat-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .chat-item {
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .chat-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .chat-item-content {
            flex: 1;
            min-width: 0;
        }

        .chat-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            font-size: 11px;
            opacity: 0.7;
        }

        .delete-chat-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }

        .delete-chat-btn:hover {
            background: rgba(239, 68, 68, 0.4);
            color: #fee;
        }

        .user-section {
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .username {
            font-size: 14px;
            font-weight: 600;
            color: #e0e7ff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .username::before {
            /* content: '👤'; */
            font-size: 16px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: calc(100% - 280px);
        }

        /* Header */
        .header {
            background: white;
            padding: 20px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 24px;
            color: #1f2937;
        }

        .header-info {
            font-size: 14px;
            color: #6b7280;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 30px;
            padding-bottom: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            max-width: 100%;
        }

        .message {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            animation: slideIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: white;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .evidence-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .evidence-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* Recommendations */
        .recommendations-container {
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-radius: 12px;
            border-left: 4px solid #667eea;
            max-width: 100%;
        }

        .recommendations-container p {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }

        .recommendation-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: white;
            color: #374151;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
            word-wrap: break-word;
            white-space: normal;
        }

        .recommendation-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: translateX(4px);
        }

        .recommendation-btn:last-child {
            margin-bottom: 0;
        }

        /* Input Area */
        .input-area {
            background: white;
            padding: 25px 30px;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
            z-index: 10;
        }

        .length-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }

        .length-selector span {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .length-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .length-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .length-option label {
            font-size: 14px;
            color: #374151;
            cursor: pointer;
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #f3f4f6;
            padding: 12px 20px;
            border-radius: 30px;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
            color: #1f2937;
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stop-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            display: none;
        }

        .stop-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        .stop-btn.visible {
            display: block;
        }

        /* Loading State */
        .loading {
            display: inline-flex;
            gap: 5px;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .welcome-message h2 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .welcome-message p {
            font-size: 16px;
        }

        /* Scrollbar */
        .chat-list::-webkit-scrollbar,
        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .chat-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .messages::-webkit-scrollbar-track {
            background: #f3f4f6;
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Chat Sessions</h3>
            <button class="menu-btn">⋮</button>
        </div>

        <button class="new-chat-btn" id="newChatBtn">
            + New Chat
        </button>

        <div class="chat-list" id="chatList">
            <!-- Chat items will be dynamically loaded here -->
        </div>

        <div class="user-section">
            <div class="username" id="username">Username</div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <h1>Health Assistant</h1>
            <div class="header-info">
                Loaded Conversational History...
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="messages" id="messages">
                <div class="welcome-message">
                    <h2>Hello! Welcome to Health Assistant</h2>
                    <p>Ask me anything about health topics and I'll provide evidence-based answers.</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="length-selector">
                <span>Answer Length:</span>
                <label class="length-option">
                    <input type="radio" name="length" value="short">
                    <span>Short</span>
                </label>
                <label class="length-option">
                    <input type="radio" name="length" value="medium" checked>
                    <span>Medium</span>
                </label>
                <label class="length-option">
                    <input type="radio" name="length" value="long">
                    <span>Long</span>
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" id="queryInput" placeholder="Ask a Health-related Question...">
                <button class="stop-btn" id="stopBtn">⏹ Stop</button>
                <button class="send-btn" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:5001/api';
        const token = localStorage.getItem('accessToken');
        
        if (!token) {
            window.location.href = './login.html';
        }

        // Display username
        const username = localStorage.getItem('username') || 'User';
        document.getElementById('username').textContent = username;

        let currentSessionId = null;
        let chatSessions = [];
        let conversationTurns = [];
        let currentEvidenceData = null;

        // Load chat sessions on page load
        async function loadChatSessions(preserveCurrentSession = false) {
            try {
                const savedSessionId = currentSessionId;
                
                const response = await fetch(`${API_BASE_URL}/sessions`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    handleLogout();
                    return;
                }
                if (!response.ok) throw new Error('Failed to fetch chat sessions.');

                chatSessions = await response.json();
                
                if (chatSessions.length === 0) {
                    currentSessionId = null;
                    await createNewSession();
                    return;
                }
                
                if (preserveCurrentSession && savedSessionId) {
                    const sessionExists = chatSessions.some(s => s.id === savedSessionId);
                    if (sessionExists) {
                        currentSessionId = savedSessionId;
                    } else {
                        currentSessionId = chatSessions[0].id;
                        await loadChatHistory(currentSessionId);
                    }
                } else if (!savedSessionId) {
                    currentSessionId = chatSessions[0].id;
                    await loadChatHistory(currentSessionId);
                }
                
                renderChatSessions();
                
            } catch (error) {
                console.error('Error loading chat sessions:', error);
            }
        }

        function renderChatSessions() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';

            chatSessions.forEach(session => {
                const chatItem = document.createElement('div');
                chatItem.className = 'chat-item';
                if (session.id === currentSessionId) {
                    chatItem.classList.add('active');
                }

                const date = new Date(session.updated_at);
                chatItem.innerHTML = `
                    <div class="chat-item-content">
                        <div class="chat-title">${session.title}</div>
                        <div class="chat-meta">${session.message_count} messages • ${date.toLocaleDateString()}</div>
                    </div>
                    <button class="delete-chat-btn" onclick="event.stopPropagation(); deleteSession(${session.id})">🗑️</button>
                `;

                chatItem.onclick = () => switchSession(session.id);
                chatList.appendChild(chatItem);
            });
        }

        async function deleteSession(sessionId) {
            if (!confirm('Are you sure you want to delete this chat session?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/sessions/${sessionId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    handleLogout();
                    return;
                }
                if (!response.ok) throw new Error('Failed to delete session.');

                // Remove from local array
                chatSessions = chatSessions.filter(s => s.id !== sessionId);

                // If deleted session was current, switch to first available or create new
                if (sessionId === currentSessionId) {
                    if (chatSessions.length > 0) {
                        currentSessionId = chatSessions[0].id;
                        await loadChatHistory(currentSessionId);
                    } else {
                        await createNewSession();
                    }
                }

                renderChatSessions();
            } catch (error) {
                console.error('Error deleting session:', error);
                alert('Failed to delete session. Please try again.');
            }
        }

        async function createNewSession() {
            try {
                const response = await fetch(`${API_BASE_URL}/sessions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title: 'New Chat' })
                });

                if (response.status === 401) {
                    handleLogout();
                    return;
                }
                if (!response.ok) throw new Error('Failed to create session.');

                const newSession = await response.json();
                currentSessionId = newSession.id;
                chatSessions.unshift(newSession);
                
                conversationTurns = [];
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = `
                    <div class="welcome-message">
                        <h2>Hello! Welcome to Health Assistant</h2>
                        <p>Ask me anything about health topics and I'll provide evidence-based answers.</p>
                    </div>
                `;
                
                renderChatSessions();

            } catch (error) {
                console.error('Error creating new session:', error);
            }
        }

        async function switchSession(sessionId) {
            if (sessionId === currentSessionId) return;
            
            currentSessionId = sessionId;
            renderChatSessions();
            await loadChatHistory(sessionId);
        }

        async function loadChatHistory(sessionId) {
            try {
                const url = `${API_BASE_URL}/history?session_id=${sessionId}`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    handleLogout();
                    return;
                }
                if (!response.ok) throw new Error('Failed to fetch chat history.');

                const history = await response.json();
                conversationTurns = history;

                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';

                if (conversationTurns.length === 0) {
                    messagesDiv.innerHTML = `
                        <div class="welcome-message">
                            <h2>Hello! Welcome to Health Assistant</h2>
                            <p>Ask me anything about health topics and I'll provide evidence-based answers.</p>
                        </div>
                    `;
                } else {
                    conversationTurns.forEach(turn => {
                        displayMessage(turn.userQuery, 'user');
                        const response = turn.aiResponse;
                        if (response.predefinedResponse) {
                            displayMessage(response.predefinedResponse, 'ai');
                        } else {
                            displayMessage(response.textualResponse || response.highlightedResponse, 'ai', response);
                        }
                    });
                }

                scrollToBottom();

            } catch (error) {
                console.error('Error loading chat history:', error);
            }
        }

        // Extended color palette - NO RED colors (red reserved for no-evidence in graph only)
        const d3ColorScheme = [
            '#4e79a7', '#f28e2c', '#76b7b2', '#59a14f', // blue, orange, teal, green
            '#edc949', '#af7aa1', '#9c755f', '#bab0ab', // yellow, purple, brown, gray
            '#17becf', '#bcbd22', '#9467bd', '#8c564b', // cyan, olive, violet, chocolate
            '#7f7f7f', '#2ca02c', '#ff7f0e', '#1f77b4', // steel gray, forest green, dark orange, steel blue
            '#4ecdc4', '#95e1d3', '#aa96da', '#fcbad3', // turquoise, mint, lavender, light pink
            '#a8d8ea', '#c7ceea', '#ffd3b6', '#a8e6cf', // sky blue, periwinkle, peach, seafoam
            '#dcedc1', '#6c5ce7', '#00b894', '#fdcb6e', // pistachio, bright purple, emerald, sunflower
            '#e84393', '#0984e3', '#00cec9', '#a29bfe', // magenta, azure, caribbean, periwinkle blue
            '#fab1a0', '#74b9ff', '#55efc4', '#ffeaa7', // terracotta, baby blue, aqua green, cream
            '#55e6c1', '#778beb', '#f8a5c2', '#63cdda'  // mint green, blue purple, pink, blue teal
        ];
        
        const NO_EVIDENCE_COLOR = '#dc2626'; // Red - NOT used in chat highlights (only in graph)

        function normalizeEntity(entity) {
            // Normalize entity for matching (lowercase, trim, remove possessives, etc.)
            return entity.toLowerCase().trim()
                .replace(/['']s?\b/g, '') // Remove 's or '
                .replace(/\s+/g, ' '); // Normalize spaces
        }

        function entitiesMatch(entity1, entity2) {
            // Check if two entities match (exact or close match)
            const norm1 = normalizeEntity(entity1);
            const norm2 = normalizeEntity(entity2);
            
            // Exact match
            if (norm1 === norm2) return true;
            
            // One contains the other (for partial matches like "alzheimer" vs "alzheimer's disease")
            if (norm1.includes(norm2) || norm2.includes(norm1)) return true;
            
            // Split by spaces and check if main words match
            const words1 = norm1.split(/\s+/);
            const words2 = norm2.split(/\s+/);
            const commonWords = words1.filter(w => words2.includes(w));
            
            // If they share significant words, consider it a match
            if (commonWords.length > 0 && commonWords.length >= Math.min(words1.length, words2.length) * 0.5) {
                return true;
            }
            
            return false;
        }

        function buildEntityColorMapFromTriples(validatedTriples) {
            // Build color map based on TRIPLES that have evidence (not just entities)
            const colorMap = new Map();
            const entitiesWithEvidence = new Map(); // Store original entity names
            const triplesWithEvidence = []; // Store triples that have evidence
            
            if (!validatedTriples) return { colorMap, entitiesWithEvidence, triplesWithEvidence };
            
            validatedTriples.forEach(triple => {
                // Check if triple has evidence (either static KG or live PubMed)
                const hasStaticEvidence = (triple.pubmed_ids && triple.pubmed_ids.length > 0) || 
                                         triple.sentence ||
                                         (triple.static_kg && triple.static_kg.evidence_found);
                const hasLiveEvidence = triple.live_pubmed && triple.live_pubmed.found_new_evidence;
                
                if (hasStaticEvidence || hasLiveEvidence) {
                    // This triple has evidence - store the triple and its entities
                    triplesWithEvidence.push({
                        subject: normalizeEntity(triple.subject),
                        object: normalizeEntity(triple.object),
                        relation: triple.relation
                    });
                    
                    // Add entities to color map
                    if (triple.subject) {
                        const normalized = normalizeEntity(triple.subject);
                        entitiesWithEvidence.set(normalized, triple.subject);
                    }
                    if (triple.object) {
                        const normalized = normalizeEntity(triple.object);
                        entitiesWithEvidence.set(normalized, triple.object);
                    }
                }
            });
            
            // Assign colors to entities with evidence in order
            let colorIndex = 0;
            entitiesWithEvidence.forEach((originalEntity, normalizedEntity) => {
                if (!colorMap.has(normalizedEntity)) {
                    colorMap.set(normalizedEntity, d3ColorScheme[colorIndex % d3ColorScheme.length]);
                    colorIndex++;
                }
            });
            
            return { colorMap, entitiesWithEvidence, triplesWithEvidence };
        }

        function highlightEntitiesInText(text, responseData) {
            if (!responseData) {
                return text;
            }

            // If no highlightedResponse, return plain text
            if (!responseData.highlightedResponse) {
                return text;
            }

            // Build color map from triples that have evidence (not just entities)
            const { colorMap, entitiesWithEvidence, triplesWithEvidence } = buildEntityColorMapFromTriples(responseData.validatedTriples);

            // Parse the highlightedResponse markers (*|entity|*) and apply colors ONLY if in context
            const regex = /\*\|(.*?)\|\*/g;
            let highlightedText = responseData.highlightedResponse;
            const fullText = highlightedText.toLowerCase();
            
            // Process each match with context awareness
            let matches = [];
            let match;
            while ((match = regex.exec(highlightedText)) !== null) {
                matches.push({
                    index: match.index,
                    length: match[0].length,
                    entity: match[1],
                    fullMatch: match[0]
                });
            }
            
            // Process in reverse to maintain indices
            matches.reverse().forEach(({ index, length, entity, fullMatch }) => {
                const normalizedEntity = normalizeEntity(entity);
                
                // Get context around this occurrence (100 chars before and after)
                const contextStart = Math.max(0, index - 100);
                const contextEnd = Math.min(fullText.length, index + length + 100);
                const context = fullText.substring(contextStart, contextEnd);
                
                let shouldHighlight = false;
                let matchedColor = null;
                
                // Check if this occurrence is part of a triple with evidence
                for (const triple of triplesWithEvidence) {
                    // Check if this entity is the subject or object of this triple
                    const isSubject = entitiesMatch(normalizedEntity, triple.subject);
                    const isObject = entitiesMatch(normalizedEntity, triple.object);
                    
                    if (isSubject || isObject) {
                        // Check if the OTHER entity from the triple is in the context
                        const otherEntity = isSubject ? triple.object : triple.subject;
                        
                        // Split into words and check for presence in context
                        const otherWords = otherEntity.split(/\s+/).filter(w => w.length > 2);
                        let wordsFound = 0;
                        
                        for (const word of otherWords) {
                            if (context.includes(word)) {
                                wordsFound++;
                            }
                        }
                        
                        // If majority of words from other entity are in context, this is the right occurrence
                        if (otherWords.length > 0 && wordsFound / otherWords.length >= 0.5) {
                            shouldHighlight = true;
                            
                            // Get the color for this specific entity
                            for (const [evidenceEntity, color] of colorMap.entries()) {
                                if (entitiesMatch(normalizedEntity, evidenceEntity)) {
                                    matchedColor = color;
                                    break;
                                }
                            }
                            break;
                        }
                    }
                }
                
                // Replace the match
                let replacement;
                if (shouldHighlight && matchedColor) {
                    replacement = `<span style="background: ${matchedColor}; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap;">${entity}</span>`;
                } else {
                    // No evidence or not in triple context - show as plain text
                    replacement = entity;
                }
                
                highlightedText = highlightedText.substring(0, index) + replacement + highlightedText.substring(index + length);
            });

            return highlightedText;
        }

        function displayMessage(text, sender, responseData = null) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            // Apply entity highlighting with KG graph colors for AI messages
            if (sender === 'ai' && responseData) {
                const highlightedText = highlightEntitiesInText(text, responseData);
                messageDiv.innerHTML = highlightedText;
            } else {
                messageDiv.textContent = text;
            }

            // Create a container for button and recommendations
            if (sender === 'ai' && responseData && (responseData.validatedTriples?.length > 0 || responseData.recommendations?.length > 0)) {
                const actionsContainer = document.createElement('div');
                actionsContainer.style.marginTop = '15px';
                
                // Add evidence button if available
                if (responseData.validatedTriples && responseData.validatedTriples.length > 0) {
                    const evidenceBtn = document.createElement('button');
                    evidenceBtn.className = 'evidence-btn';
                    evidenceBtn.textContent = 'Click for Evidence';
                    evidenceBtn.onclick = () => {
                        // Store evidence data and navigate to evidence page
                        localStorage.setItem('currentEvidence', JSON.stringify(responseData));
                        window.location.href = './evidence.html';
                    };
                    actionsContainer.appendChild(evidenceBtn);
                }
                
                // Add recommendations below the evidence button
                if (responseData.recommendations && responseData.recommendations.length > 0) {
                    const recContainer = document.createElement('div');
                    recContainer.className = 'recommendations-container';
                    
                    const title = document.createElement('p');
                    title.textContent = 'Suggested Questions:';
                    recContainer.appendChild(title);
                    
                    responseData.recommendations.forEach(recText => {
                        const recBtn = document.createElement('button');
                        recBtn.className = 'recommendation-btn';
                        recBtn.textContent = recText;
                        recBtn.onclick = () => {
                            document.getElementById('queryInput').value = recText;
                            sendMessage();
                        };
                        recContainer.appendChild(recBtn);
                    });
                    
                    actionsContainer.appendChild(recContainer);
                }
                
                messageDiv.appendChild(actionsContainer);
            }

            messagesDiv.appendChild(messageDiv);
        }

        let isProcessing = false;
        let abortController = null;

        async function sendMessage() {
            const queryInput = document.getElementById('queryInput');
            const query = queryInput.value.trim();
            if (!query) return;

            // Prevent multiple queries at once
            if (isProcessing) {
                alert('Please wait for the current query to complete or click Stop.');
                return;
            }

            if (!currentSessionId) {
                alert('Please create or select a chat session first.');
                return;
            }

            const answerLength = document.querySelector('input[name="length"]:checked').value;

            displayMessage(query, 'user');
            queryInput.value = '';

            // Set processing state
            isProcessing = true;
            abortController = new AbortController();
            toggleProcessingUI(true);

            const thinkingMsg = document.createElement('div');
            thinkingMsg.className = 'message ai';
            thinkingMsg.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
            document.getElementById('messages').appendChild(thinkingMsg);
            scrollToBottom();

            try {
                const response = await fetch(`${API_BASE_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        query, 
                        answerLength,
                        session_id: currentSessionId
                    }),
                    signal: abortController.signal
                });

                thinkingMsg.remove();

                if (response.status === 401) {
                    handleLogout();
                    return;
                }
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Request failed');
                }

                const data = await response.json();

                if (data.predefinedResponse) {
                    displayMessage(data.predefinedResponse, 'ai');
                } else {
                    displayMessage(data.textualResponse || data.highlightedResponse, 'ai', data);
                }

                scrollToBottom();
                await loadChatSessions(true);

            } catch (error) {
                console.error('Error:', error);
                thinkingMsg.remove();
                
                if (error.name === 'AbortError') {
                    displayMessage('Query stopped by user.', 'ai');
                } else {
                    displayMessage(`Sorry, an error occurred: ${error.message}`, 'ai');
                }
            } finally {
                // Reset processing state
                isProcessing = false;
                abortController = null;
                toggleProcessingUI(false);
            }
        }

        function stopProcessing() {
            if (abortController) {
                abortController.abort();
            }
        }

        function toggleProcessingUI(processing) {
            const sendBtn = document.getElementById('sendBtn');
            const stopBtn = document.getElementById('stopBtn');
            const queryInput = document.getElementById('queryInput');

            if (processing) {
                sendBtn.disabled = true;
                stopBtn.classList.add('visible');
                queryInput.disabled = true;
            } else {
                sendBtn.disabled = false;
                stopBtn.classList.remove('visible');
                queryInput.disabled = false;
            }
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleLogout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('username');
            window.location.href = './login.html';
        }

        // Event Listeners
        document.getElementById('newChatBtn').addEventListener('click', createNewSession);
        document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('stopBtn').addEventListener('click', stopProcessing);
        document.getElementById('queryInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) sendMessage();
        });

        // Initialize
        loadChatSessions();
    </script>
</body>
</html>
